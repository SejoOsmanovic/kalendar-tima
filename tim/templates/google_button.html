{% if google_client_id %}
<form id="google-signin" action="{% url 'google_verify' %}" method="post">
  {% csrf_token %}<input type="hidden" name="credential">
  <div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="submitGoogleSignIn" data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-text="continue_with" data-theme="outline" data-width="240"></div>
  <p id="google-status" role="status"></p>
</form>
<script>
  function submitGoogleSignIn(response) {
    const form = document.getElementById("google-signin");
    if (form.elements.credential.value) return;
    document.getElementById("google-status").textContent = "Verifying your Google account…";
    form.elements.credential.value = response.credential;
    form.submit();
  }
  window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
      document.getElementById("google-signin").elements.credential.value = "";
      document.getElementById("google-status").textContent = "";
    }
  });
</script>
<script src="https://accounts.google.com/gsi/client" async onerror="document.getElementById('google-status').textContent='Google sign-in could not load. Refresh this page to try again.'"></script>
{% endif %}
