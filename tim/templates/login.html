{% extends "base.html" %}{% block body %}<section class="login panel pad"><small>INTERNI PRISTUP</small><h1>Prijava</h1><p>Prijavite se za pristup kalendaru vašeg tima.</p><form method="post">{% csrf_token %}{% if form.errors %}<p class="notice">Provjerite podatke za prijavu. Za novi nalog potrebno je odobrenje administratora.</p>{% endif %}<label for="u">E-mail ili korisničko ime</label><input id="u" name="username" autocomplete="username" required autofocus><label for="p">Lozinka</label><input id="p" type="password" name="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button>Prijavi se →</button></form><p>Nemaš nalog? <a href="/registracija/">Registruj se</a></p></section>{% endblock %}
