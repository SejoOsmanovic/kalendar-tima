services:
  - type: web
    name: scale-up-vacation-tracker
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /prijava/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS
        value: "1"
      - key: GOOGLE_REDIRECT_ENABLED
        value: "1"
      - key: GOOGLE_CLIENT_ID
        value: "289150898494-5b5ajb5oq9eialdsvl5h415unjctnhb8.apps.googleusercontent.com"
